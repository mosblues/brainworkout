<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Solutions Viewer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --ink:#1f2937; --btn:#111827; --paper:#ffffff; --stone:#efefef;
      --accent:#2c397e;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:#f6f7fb}
    a{color:inherit}
    .wrap{max-width:1200px;margin:0 auto;padding:12px 16px 24px}
    header{display:flex;align-items:center;gap:12px;padding:10px 0}
    header img{height:42px;width:auto}
    header .title{font-size:1.1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bar{
      display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
      background:var(--paper);border:2px solid #000;border-radius:14px;padding:10px 12px;margin:8px 0 14px
    }
    .bar-left,.bar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .field{display:flex;align-items:center;gap:6px}
    input[type="number"]{
      width:86px;padding:6px 8px;border:1.5px solid var(--ink);border-radius:8px;font:inherit
    }
    .btn{
      display:inline-flex;align-items:center;gap:6px;cursor:pointer;
      padding:.55rem .8rem;font-weight:600;border-radius:8px;border:2px solid var(--ink);
      background:#fff;transition:background-color .25s,transform .06s ease-in
    }
    .btn:active{transform:translateY(1px)}
    .btn-primary{background:var(--btn);color:#fff;border-color:var(--btn)}
    .btn-primary:hover{background:#0b1220}
    .btn-outline:hover{background:#f3f4f6}
    .canvas-shell{
      background:var(--paper);border:7px solid var(--ink);border-radius:20px;padding:10px;overflow:auto
    }
    #canvas-wrap{display:flex;justify-content:center;align-items:flex-start;min-height:300px}
    canvas{background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.08)}
    .hint{margin:10px 0 0 0;font-size:.9rem;color:#4b5563}
    @media (max-width:640px){
      header{gap:8px}
      header img{height:36px}
      .bar{padding:8px;border-width:2px;border-radius:12px}
      .canvas-shell{border-width:5px}
      input[type="number"]{width:74px}
      .btn{width:100%;justify-content:center}
      .bar-right{width:100%}
    }
  </style>

  <!-- PDF.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js" defer></script>
</head>
<body>
  <div class="wrap">
    <header>
      <a href="/" aria-label="Back to Home">
        <img src="http://brainworkoutbooks.com/logo.png" alt="Brain Workout Books">
      </a>
      <div class="title" id="doc-title">Solutions</div>
    </header>

    <div class="bar">
      <div class="bar-left">
        <div class="field">
          <strong>Page</strong>
          <input type="number" id="page-input" min="1" value="1"/>
          <span id="page-total">/ —</span>
        </div>
        <button class="btn btn-outline" id="prev-btn" title="Previous page">◀ Prev</button>
        <button class="btn btn-outline" id="next-btn" title="Next page">Next ▶</button>
      </div>

      <div class="bar-right">
        <button class="btn btn-outline" id="zoom-out" title="Zoom out">Zoom −</button>
        <button class="btn btn-outline" id="zoom-in" title="Zoom in">Zoom +</button>
        <button class="btn btn-outline" id="fit-width" title="Fit to width">Fit to Width</button>
        <a class="btn btn-primary" id="download-link" href="#" download>Download PDF</a>
      </div>
    </div>

    <div class="canvas-shell">
      <div id="canvas-wrap">
        <canvas id="pdf-canvas"></canvas>
      </div>
    </div>

    <p class="hint">
      Tip: escribí un número de página y presioná <strong>Enter</strong> para ir directo.
    </p>
  </div>

  <script>
    // Lee parámetros ?file= &title= &page=
    const params = new URLSearchParams(location.search);
    const pdfUrl = params.get('file') || '/downloads/5000-en-solutions.pdf';
    const startPage = parseInt(params.get('page') || '1', 10);
    const customTitle = params.get('title') || 'Solutions';

    // UI
    const titleEl = document.getElementById('doc-title');
    const pageInput = document.getElementById('page-input');
    const pageTotal = document.getElementById('page-total');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const zoomIn = document.getElementById('zoom-in');
    const zoomOut = document.getElementById('zoom-out');
    const fitWidthBtn = document.getElementById('fit-width');
    const downloadLink = document.getElementById('download-link');

    titleEl.textContent = customTitle;
    downloadLink.href = pdfUrl;

    // PDF.js config
    let pdfDoc = null;
    let pageNum = Math.max(1, startPage);
    let scale = 1.15;
    let minScale = 0.5, maxScale = 4.0;
    let fitWidthMode = false;

    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');

    function renderPage(num){
      pdfDoc.getPage(num).then(function(page){
        // Si está activado Fit Width, recalculá escala según el ancho del contenedor
        if(fitWidthMode){
          const wrap = document.getElementById('canvas-wrap');
          const unscaled = page.getViewport({ scale: 1 });
          const target = wrap.clientWidth - 16; // padding de shell
          scale = Math.min(maxScale, Math.max(minScale, target / unscaled.width));
        }
        const viewport = page.getViewport({ scale });
        const outputScale = window.devicePixelRatio || 1;

        canvas.width  = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width  = Math.floor(viewport.width) + "px";
        canvas.style.height = Math.floor(viewport.height) + "px";

        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;
        const renderContext = { canvasContext: ctx, viewport, transform };
        page.render(renderContext);
      });

      pageInput.value = num;
      pageTotal.textContent = '/ ' + pdfDoc.numPages;
      prevBtn.disabled = (num <= 1);
      nextBtn.disabled = (num >= pdfDoc.numPages);
    }

    function queueRenderPage(num){
      if(num < 1 || num > pdfDoc.numPages) return;
      pageNum = num;
      renderPage(pageNum);
    }

    function changePage(delta){
      queueRenderPage(pageNum + delta);
    }

    function changeZoom(delta){
      fitWidthMode = false; // si tocás zoom, desactiva Fit Width
      scale = Math.min(maxScale, Math.max(minScale, scale + delta));
      renderPage(pageNum);
    }

    // Eventos UI
    prevBtn.addEventListener('click', () => changePage(-1));
    nextBtn.addEventListener('click', () => changePage(1));
    zoomIn.addEventListener('click', () => changeZoom(+0.15));
    zoomOut.addEventListener('click', () => changeZoom(-0.15));
    fitWidthBtn.addEventListener('click', () => {
      fitWidthMode = true;
      renderPage(pageNum);
    });
    pageInput.addEventListener('change', () => queueRenderPage(parseInt(pageInput.value || '1',10)));
    pageInput.addEventListener('keyup', (e) => {
      if(e.key === 'Enter'){ queueRenderPage(parseInt(pageInput.value || '1',10)); }
    });
    window.addEventListener('resize', () => { if(fitWidthMode){ renderPage(pageNum); } });

    // Carga del PDF
    document.addEventListener('DOMContentLoaded', () => {
      // worker PDF.js
      if(window['pdfjsLib']){
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        loadingTask.promise.then(function(pdf){
          pdfDoc = pdf;
          pageNum = Math.min(Math.max(1, pageNum), pdfDoc.numPages);
          renderPage(pageNum);
        }).catch(err => {
          alert("Error loading PDF. Make sure the file path is correct and hosted on the same domain.\n\n" + err.message);
        });
      } else {
        alert("PDF.js failed to load. Check your CDN link.");
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
 
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PTC6RGCP6S"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());

    gtag('config', 'G-PTC6RGCP6S');
  </script>

  
  <script>
      if (location.protocol === "http:") {
        location.href = location.href.replace("http:", "https:");
      }
    </script>
    
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Killer is Here - Digital Case</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

  <main class="page">
    <header class="site-header">
      <a class="home-btn" href="https://www.brainworkoutbooks.com" aria-label="Back to home">
        <img src="icon-home.png" alt="" />
      </a>
    
      <img class="site-logo" src="logo-kih.png" alt="The Killer is Here" />
    
      <div class="header-spacer"></div>
    </header>
    
    <div id="timerContainer">
      <div class="timer-row">
        <span id="timerLabel">TIME</span>
        <span id="timer">00:00</span>
      </div>

      <button id="shareBtn" class="share-btn">Share Result</button>
      <div id="shareMessage" class="share-message"></div>
    </div>

    <div class="case-area">
      <div class="tools-sidebar">
        <button id="helpBtn" class="tool-btn help-tool" title="How to Play">?</button>
        <button id="undoBtn" class="tool-btn" title="Undo">↶</button>
        <button id="clearBtn" class="tool-btn" title="Clear">×</button>
        <button id="sizeBtn" class="tool-btn" title="Brush Size">●</button>
        
        <button id="colorBtn" class="tool-btn color-tool" title="Color">
          <input id="colorPicker" type="color" value="#ff0000" />
        </button>

        <div id="sizePanel" class="tool-panel">
          <input id="sizeSlider" type="range" min="6" max="50" value="18" />
        </div>
      </div>

      <div class="case-wrapper" id="caseWrapper">
        <div class="image-stage" id="imageStage">
          <img id="caseImage" src="" alt="Daily mystery case" />
          <canvas id="drawingCanvas"></canvas>
          <canvas id="previewCanvas"></canvas>
          <div id="brushCursor"></div>
          <div id="solvedOverlay"></div>
        </div>
      </div>
    </div>

    <section class="answers">
      <input type="text" id="weaponInput" placeholder="Weapon" />
      <input type="text" id="killerInput" placeholder="Killer" />
      <input type="text" id="victimInput" placeholder="Victim" />
      <input type="text" id="locationInput" placeholder="Location" />
    </section>

    <button id="checkAnswersBtn" class="check-btn">Check Answers</button>

    <section class="book-promo">
    
      <div class="promo-divider"></div>
    
      <h2>Ready for the Next Case?</h2>
    
      <p class="promo-text">
        Solve 100 more mystery cases in the full book edition.
      </p>
    
      <img
        class="promo-image"
        src="book-promo.jpg"
        alt="The Killer is Here book"
      />
    
      <a
        class="amazon-btn"
        href="TU_LINK_DE_AMAZON"
        target="_blank"
        rel="noopener noreferrer"
      >
        Solve 100 More Cases
      </a>
    
    </section>
    
    <footer class="site-footer">
    
      <div class="footer-divider"></div>
    
      <p>
        Questions or business inquiries:
      </p>
    
      <a href="mailto:TU_MAIL">
        TU_MAIL
      </a>
    
    </footer>

   
    <div id="tutorialModal" class="tutorial-modal">
      <div class="tutorial-content">
        <button id="closeTutorialBtn" class="tutorial-close" title="Close">×</button>
        <img src="tutorial.jpg" alt="How to play The Killer is Here" />
      </div>
    </div>
    
  </main>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>5000 Unique Words — Solutions</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{ --ink:#1f2937; --paper:#ffffff; }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:#f6f7fb}
    .wrap{max-width:1200px;margin:0 auto;padding:12px 16px 24px}
    header{display:flex;align-items:center;gap:12px;padding:10px 0}
    header img{height:42px;width:auto}
    h1{font-size:1.2rem;margin:0}
    .frame-shell{
      background:var(--paper);border:7px solid #000;border-radius:20px;
      padding:8px; overflow:hidden;
    }
    iframe{
      width:100%; height: calc(100vh - 180px); border:0; border-radius:12px; background:#fff;
    }
    .alt{margin:10px 2px 0 2px;font-size:.95rem}
    .alt a{font-weight:600;color:inherit}
    @media (max-width:640px){
      .frame-shell{border-width:5px}
      header img{height:36px}
      iframe{height: calc(100vh - 160px)}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a href="/"><img src="http://brainworkoutbooks.com/logo.png" alt="Brain Workout Books"></a>
      <h1>5000 Unique Words — <strong>Solutions</strong></h1>
    </header>

    <div class="frame-shell">
      <!-- 👇 Viewer genérico + tu PDF -->
      <iframe
        src="/solutions/?file=/downloads/WSB_Solutions.pdf
       &title=5000%20Unique%20Words%20%E2%80%94%20Solutions
       &embed=1&fit=width"
  title="5000 Unique Words — Solutions"
  allowfullscreen>
      </iframe>
    </div>

    <p class="alt">
      Preferís directo? <a href="/downloads/WSB_Solutions.pdf" target="_blank" rel="noopener">Abrir el PDF</a>.
    </p>
  </div>
</body>
</html>
